title: AI Audit Evidence Pipeline
description: Lab series for building an AI-powered audit evidence evaluation system using Azure Logic Apps
remote_theme: just-the-docs/just-the-docs

# Color scheme (light/dark/auto)
color_scheme: dark

# Logo (optional - add your own)
# logo: "/assets/images/logo.png"

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/your-org/ai-calibration"

# Footer
footer_content: "AI Calibration Labs &copy; 2026. Built with Azure + Logic Apps."

# Navigation structure
nav_enabled: true
nav_sort: case_insensitive

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Callouts (for tips, warnings, notes)
callouts:
  tip:
    title: Tip
    color: blue
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: yellow
  important:
    title: Important
    color: purple

# Exclude from processing
exclude:
  - "*.md~"
  - ".git"
  - "node_modules"
